name: Sync LeetCode

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:           # "Run workflow" button = sync right now
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: ["index.html", "data/manual.json"]

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Only process issues that you opened with the "Log complexity" form.
    if: >-
      github.event_name != 'issues' ||
      (contains(github.event.issue.labels.*.name, 'complexity-log') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Record manual complexity entry
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/log_issue.py

      - name: Pull submissions
        id: sync
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        run: python scripts/sync.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "prep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data solutions
          # A refresh that only bumps timestamps isn't worth a commit.
          if git diff --cached --quiet -- data/submissions.json data/manual.json data/problems.json solutions; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset -q
          else
            git commit -q -m "${{ steps.sync.outputs.message }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Logged ✅ — the dashboard will update in a minute."

  build-pages:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # include the commit the sync job just pushed
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
