<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Prep</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232a78d6'/><path d='M4 11l3-3-3-3M8 11h4' stroke='white' stroke-width='1.6' fill='none'/></svg>">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --s-acc: #2a78d6; --s-fail: #eb6834;
  --easy: #1baf7a; --medium: #eda100; --hard: #e34948;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --warning: #fab219;
  --seq-0: #efeee9; --seq-1: #b7d3f6; --seq-2: #6da7ec; --seq-3: #2a78d6; --seq-4: #184f95;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --s-acc: #3987e5; --s-fail: #d95926;
    --easy: #199e70; --medium: #c98500; --hard: #e66767;
    --good-text: #0ca30c;
    --seq-0: #262624; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5; --s-acc: #3987e5; --s-fail: #d95926;
  --easy: #199e70; --medium: #c98500; --hard: #e66767;
  --good-text: #0ca30c;
  --seq-0: #262624; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--ring); background: var(--surface); color: var(--ink); padding: 6px 11px; border-radius: 8px; font-size: 13px; }
.banner { background: var(--surface); border: 1px solid var(--ring); border-left: 3px solid var(--warning); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: var(--ink-2); }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); margin-bottom: 16px; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--ink); }
.card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .detail { font-size: 12px; color: var(--muted); }
.dots { display: inline-flex; gap: 10px; }
.dot { display: inline-flex; align-items: center; gap: 4px; }
.dot i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
svg text { font-family: inherit; }
.heat-wrap { overflow-x: auto; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 6px; font-size: 12px; line-height: 1.35; z-index: 10; opacity: 0; transition: opacity .08s; max-width: 260px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.ok { color: var(--good-text); }
.bad { color: var(--critical); }
.cx { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
.muted { color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--grid); position: relative; min-width: 60px; }
.bar > b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
pre { white-space: pre-wrap; word-break: break-all; background: var(--page); border-radius: 6px; padding: 6px 8px; margin: 6px 0 0; font-size: 12px; max-height: 160px; overflow: auto; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.hbar-row { display: grid; grid-template-columns: 130px 1fr 36px; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; }
.hbar-row .bar > b { background: var(--s-fail); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Interview Prep</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="Time range">
        <button data-days="7">7d</button><button data-days="30">30d</button><button data-days="90">90d</button><button data-days="0" aria-pressed="true">All</button>
      </div>
      <div class="seg" id="diff" role="group" aria-label="Difficulty">
        <button data-d="" aria-pressed="true">All</button><button data-d="Easy">Easy</button><button data-d="Medium">Med</button><button data-d="Hard">Hard</button>
      </div>
      <a class="btn" id="sync-now" target="_blank" rel="noopener">Sync now ↗</a>
    </div>
  </header>

  <div id="banners"></div>
  <div id="app"></div>
</main>
<div class="tip" id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400;
const state = { days: 0, diff: "" };
let DATA = null;

const STATUS_COLOR = { "Accepted": "var(--good)", "Wrong Answer": "var(--critical)", "Time Limit Exceeded": "var(--warning)",
  "Runtime Error": "var(--critical)", "Compile Error": "var(--muted)", "Memory Limit Exceeded": "var(--warning)" };
const DIFF_COLOR = { Easy: "var(--easy)", Medium: "var(--medium)", Hard: "var(--hard)" };
const fmtDate = ts => new Date(ts * 1000).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const dayKey = ts => { const d = new Date(ts * 1000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";

// ---- tooltip --------------------------------------------------------------
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(e); }
function moveTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mouseenter", e => showTip(e, el.dataset.tip));
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);
  });
}

// ---- filters --------------------------------------------------------------
function bindSeg(id, key, attr) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state[key] = attr === "days" ? +b.dataset.days : b.dataset.d;
    try { localStorage.setItem("prep-filters", JSON.stringify(state)); } catch {}
    render();
  });
}
function restoreFilters() {
  try {
    const s = JSON.parse(localStorage.getItem("prep-filters") || "{}");
    if (s.days != null) { state.days = s.days; $("#range").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.days === s.days)); }
    if (s.diff != null) { state.diff = s.diff; $("#diff").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === s.diff)); }
  } catch {}
}

// ---- derived stats --------------------------------------------------------
function filtered() {
  const now = Date.now() / 1000;
  return DATA.submissions.filter(s =>
    (!state.days || s.timestamp >= now - state.days * DAY) && (!state.diff || s.difficulty === state.diff));
}

function byProblem(subs) {
  const m = new Map();
  for (const s of [...subs].sort((a, b) => a.timestamp - b.timestamp)) {
    if (!m.has(s.slug)) m.set(s.slug, { slug: s.slug, title: s.title, id: s.id, difficulty: s.difficulty, tags: s.tags || [], subs: [] });
    m.get(s.slug).subs.push(s);
  }
  for (const p of m.values()) {
    const firstAc = p.subs.findIndex(s => s.status === "Accepted");
    p.solved = firstAc >= 0;
    p.attemptsToSolve = p.solved ? firstAc + 1 : null;
    p.fails = p.subs.filter(s => s.status !== "Accepted").length;
    p.last = p.subs[p.subs.length - 1].timestamp;
    p.cxMiss = p.subs.some(s => s.complexity && (s.complexity.time_ok === false || s.complexity.space_ok === false));
  }
  return [...m.values()];
}

function streak(all) {
  const days = new Set(all.filter(s => s.status === "Accepted").map(s => dayKey(s.timestamp)));
  let n = 0, t = Date.now() / 1000;
  if (!days.has(dayKey(t))) t -= DAY;           // today doesn't break the streak yet
  while (days.has(dayKey(t))) { n++; t -= DAY; }
  return n;
}

// ---- sections -------------------------------------------------------------
function kpis(subs, probs) {
  const solved = probs.filter(p => p.solved);
  const byD = d => solved.filter(p => p.difficulty === d).length;
  const acc = subs.filter(s => s.status === "Accepted").length;
  const firstTry = solved.filter(p => p.attemptsToSolve === 1).length;
  const graded = subs.filter(s => s.complexity && (s.complexity.time_ok != null || s.complexity.space_ok != null));
  const tOk = graded.filter(s => s.complexity.time_ok === true).length, tN = graded.filter(s => s.complexity.time_ok != null).length;
  const sOk = graded.filter(s => s.complexity.space_ok === true).length, sN = graded.filter(s => s.complexity.space_ok != null).length;
  const tile = (label, value, detail) => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="detail">${detail}</div></div>`;
  return `<div class="grid kpis">
    ${tile("Problems solved", solved.length, `<span class="dots">${["Easy","Medium","Hard"].map(d => `<span class="dot"><i style="background:${DIFF_COLOR[d]}"></i>${byD(d)} ${d[0]}</span>`).join("")}</span>`)}
    ${tile("Submissions", subs.length, `${acc} accepted · ${pct(acc, subs.length)} acceptance`)}
    ${tile("Solved first try", pct(firstTry, solved.length), `${firstTry} of ${solved.length} solved problems`)}
    ${tile("Time complexity right", pct(tOk, tN), tN ? `${tOk} of ${tN} checked` : "Log the actual complexity to track this")}
    ${tile("Space complexity right", pct(sOk, sN), sN ? `${sOk} of ${sN} checked` : "Log the actual complexity to track this")}
    ${tile("Current streak", `${streak(DATA.submissions)}<span style="font-size:15px;font-weight:500;color:var(--ink-2)"> days</span>`, "Days in a row with an accepted solve")}
  </div>`;
}

function heatmap(all) {
  // Last 26 weeks, ending this week; always computed on all submissions in the difficulty filter.
  const counts = {};
  for (const s of all) counts[dayKey(s.timestamp)] = (counts[dayKey(s.timestamp)] || 0) + 1;
  const weeks = 26, cell = 13, gap = 3, top = 18, left = 26;
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today); start.setDate(start.getDate() - start.getDay() - (weeks - 1) * 7);
  const max = Math.max(1, ...Object.values(counts));
  const level = c => c === 0 ? 0 : Math.min(4, Math.ceil(4 * c / max));
  let rects = "", months = "", lastMonth = -1, lastLabelX = -99;
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d);
    if (dt > today) continue;
    const k = dayKey(dt / 1000), c = counts[k] || 0;
    const x = left + w * (cell + gap), y = top + d * (cell + gap);
    if (d === 0 && dt.getMonth() !== lastMonth) {
      lastMonth = dt.getMonth();
      if (x - lastLabelX >= 30) {
        lastLabelX = x;
        months += `<text x="${x}" y="11" font-size="10" fill="var(--muted)">${dt.toLocaleString(undefined, {month: "short"})}</text>`;
      }
    }
    rects += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" fill="var(--seq-${level(c)})" data-tip="<b>${c} submission${c === 1 ? "" : "s"}</b><br>${dt.toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"})}"/>`;
  }
  const days = ["", "Mon", "", "Wed", "", "Fri", ""].map((l, d) => l && `<text x="0" y="${top + d * (cell + gap) + 10}" font-size="10" fill="var(--muted)">${l}</text>`).join("");
  const W = left + weeks * (cell + gap), H = top + 7 * (cell + gap);
  return `<div class="card"><h2>Activity <small>last 26 weeks</small></h2>
    <div class="heat-wrap"><svg width="${W}" height="${H}" role="img" aria-label="Submissions per day heatmap">${months}${days}${rects}</svg></div>
    <div class="legend"><span>Less</span>${[0,1,2,3,4].map(l => `<i style="background:var(--seq-${l})"></i>`).join("")}<span>More</span></div></div>`;
}

function weekly(subs) {
  // Accepted vs failed per week (stacked), last 12 weeks or the selected range.
  const nWeeks = state.days ? Math.max(1, Math.ceil(state.days / 7)) : 12;
  const now = new Date(); now.setHours(0,0,0,0);
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  const buckets = Array.from({length: nWeeks}, (_, i) => {
    const s = new Date(weekStart); s.setDate(s.getDate() - (nWeeks - 1 - i) * 7);
    return { start: s / 1000, ac: 0, fail: 0 };
  });
  for (const s of subs) {
    const b = buckets.findLast(b => s.timestamp >= b.start);
    if (b) s.status === "Accepted" ? b.ac++ : b.fail++;
  }
  const W = 460, H = 170, padL = 28, padB = 22, padT = 8;
  const max = Math.max(4, ...buckets.map(b => b.ac + b.fail));
  const nice = Math.ceil(max / 4) * 4;
  const bw = (W - padL) / nWeeks, barW = Math.min(28, bw * 0.62);
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = nice * i / 4;
    g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${i ? "var(--grid)" : "var(--axis)"}" stroke-width="1"/>
          <text x="${padL - 6}" y="${y(v) + 3}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`;
  }
  buckets.forEach((b, i) => {
    const x = padL + i * bw + (bw - barW) / 2;
    const date = new Date(b.start * 1000).toLocaleDateString(undefined, {month: "short", day: "numeric"});
    const hAc = y(0) - y(b.ac), hF = y(0) - y(b.fail);
    const tipHtml = `<b>Week of ${date}</b><br>${b.ac} accepted · ${b.fail} failed`;
    // accepted sits on the baseline; failed stacks above with a 2px surface gap
    if (b.ac) g += `<path d="${roundTop(x, y(b.ac), barW, hAc, b.fail ? 0 : 4)}" fill="var(--s-acc)"/>`;
    if (b.fail) g += `<path d="${roundTop(x, y(b.ac + b.fail), barW, hF - (b.ac ? 2 : 0), 4)}" fill="var(--s-fail)"/>`;
    g += `<rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent" data-tip="${esc(tipHtml)}"/>`;
    if (nWeeks <= 6 || i % Math.ceil(nWeeks / 6) === (nWeeks - 1) % Math.ceil(nWeeks / 6))
      g += `<text x="${x + barW / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${date}</text>`;
  });
  return `<div class="card"><h2>Weekly submissions</h2>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Accepted and failed submissions per week">${g}</svg>
    <div class="legend"><span><i style="background:var(--s-acc)"></i>Accepted</span><span><i style="background:var(--s-fail)"></i>Failed</span></div></div>`;
}
function roundTop(x, y, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function mistakes(subs) {
  const fails = subs.filter(s => s.status !== "Accepted");
  const counts = {};
  for (const s of fails) counts[s.status] = (counts[s.status] || 0) + 1;
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  const cxMiss = subs.filter(s => s.complexity && (s.complexity.time_ok === false || s.complexity.space_ok === false)).length;
  return `<div class="card"><h2>What goes wrong <small>${fails.length} failed submission${fails.length === 1 ? "" : "s"}</small></h2>
    ${rows.length ? rows.map(([k, v]) => `<div class="hbar-row" data-tip="<b>${esc(k)}</b><br>${v} submission${v === 1 ? "" : "s"} (${pct(v, fails.length)} of failures)">
      <span>${esc(k)}</span><div class="bar"><b style="width:${100 * v / max}%"></b></div><span class="num muted">${v}</span></div>`).join("")
      : `<p class="muted">No failed submissions in this range.</p>`}
    <div class="hbar-row" style="margin-top:14px" data-tip="Accepted submissions where your stated time or space complexity was wrong">
      <span>Wrong complexity</span><div class="bar"><b style="width:${100 * cxMiss / Math.max(max, cxMiss, 1)}%;background:var(--critical)"></b></div><span class="num muted">${cxMiss}</span></div>
  </div>`;
}

function topics(probs) {
  const t = {};
  for (const p of probs) for (const tag of p.tags) {
    const r = t[tag] ||= { tag, n: 0, solved: 0, attempts: 0, fails: 0, cxMiss: 0 };
    r.n++; r.solved += p.solved; r.attempts += p.subs.length; r.fails += p.fails; r.cxMiss += p.cxMiss;
  }
  const rows = Object.values(t).map(r => ({ ...r, failRate: r.fails / Math.max(1, r.attempts) }))
    .sort((a, b) => b.failRate - a.failRate || b.n - a.n).slice(0, 12);
  return `<div class="card"><h2>Topics <small>sorted by failure rate; weakest first</small></h2><div class="scroll"><table>
    <thead><tr><th>Topic</th><th class="num">Problems</th><th class="num">Solved</th><th>Failure rate</th><th class="num">Complexity misses</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.tag)}</td><td class="num">${r.n}</td><td class="num">${r.solved}</td>
      <td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><b style="width:${100 * r.failRate}%;background:var(--s-fail)"></b></div><span class="num muted" style="width:34px">${Math.round(100 * r.failRate)}%</span></div></td>
      <td class="num">${r.cxMiss || '<span class="muted">0</span>'}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No data yet.</td></tr>`}
    </tbody></table></div></div>`;
}

function review(probs) {
  const now = Date.now() / 1000;
  const rows = probs.filter(p => p.fails > 0 || p.cxMiss || !p.solved)
    .map(p => ({ ...p, why: [!p.solved && "not solved yet", p.fails && `${p.fails} failed attempt${p.fails > 1 ? "s" : ""}`, p.cxMiss && "complexity wrong"].filter(Boolean).join(" · "),
                 age: Math.floor((now - p.last) / DAY) }))
    .sort((a, b) => (!b.solved - !a.solved) || (b.cxMiss - a.cxMiss) || b.fails - a.fails).slice(0, 10);
  return `<div class="card"><h2>Review queue <small>re-solve these</small></h2><div class="scroll"><table>
    <thead><tr><th>Problem</th><th>Why</th><th class="num">Last tried</th></tr></thead>
    <tbody>${rows.map(p => `<tr><td>${probLink(p)}</td><td class="muted">${p.why}</td><td class="num muted">${p.age ? p.age + "d ago" : "today"}</td></tr>`).join("")
      || `<tr><td colspan="3" class="muted">Nothing to review. Nice.</td></tr>`}</tbody></table></div></div>`;
}

function probLink(p) {
  return `<span class="pill" style="--c:${DIFF_COLOR[p.difficulty] || "var(--muted)"}" title="${esc(p.difficulty)}"></span>
    <a href="https://leetcode.com/problems/${esc(p.slug)}/" target="_blank" rel="noopener">${p.id ? p.id + ". " : ""}${esc(p.title)}</a>`;
}

function cxCell(c, dim) {
  const mine = c?.[`my_${dim}`], actual = c?.[`actual_${dim}`], ok = c?.[`${dim}_ok`];
  if (!mine && !actual) return `<span class="muted">—</span>`;
  const mark = ok === true ? `<span class="ok" title="Correct">✓</span>` : ok === false ? `<span class="bad" title="Incorrect">✗</span>` : "";
  const tipHtml = `<b>${dim === "time" ? "Time" : "Space"}</b><br>You: ${esc(mine || "not stated")}<br>Actual: ${esc(actual || "not logged yet")}${c.notes ? "<br><br>" + esc(c.notes) : ""}`;
  return `<span class="cx" data-tip="${esc(tipHtml)}">${mark} ${esc(mine || "?")}${ok === false && actual ? ` <span class="muted">→ ${esc(actual)}</span>` : ""}</span>`;
}

function logLink(s) {
  if (!DATA.repo) return "";
  const q = new URLSearchParams({ template: "log-complexity.yml", title: `complexity: ${s.title}`, problem: s.slug, submission: s.key,
    my_time: s.complexity?.my_time || "", my_space: s.complexity?.my_space || "" });
  return `<a href="https://github.com/${DATA.repo}/issues/new?${q}" target="_blank" rel="noopener" title="Log your complexity and the actual answer">log</a>`;
}

function log(subs) {
  const rows = subs.slice(0, 60);
  return `<div class="card"><h2>Submissions <small>most recent ${rows.length} of ${subs.length}</small></h2><div class="scroll"><table>
    <thead><tr><th>When</th><th>Problem</th><th>Result</th><th class="num">Tests</th><th>Lang</th><th class="num">Runtime</th><th>Time (you)</th><th>Space (you)</th><th></th></tr></thead>
    <tbody>${rows.map(s => {
      const fail = s.status !== "Accepted" && (s.last_input || s.error) ? `<details><summary>details</summary>
        ${s.error ? `<pre>${esc(s.error)}</pre>` : ""}${s.last_input ? `<pre>Input:    ${esc(s.last_input)}\nExpected: ${esc(s.expected)}\nOutput:   ${esc(s.output)}</pre>` : ""}</details>` : "";
      const code = s.solution_path && DATA.repo ? ` <a class="muted" href="https://github.com/${DATA.repo}/blob/main/${esc(s.solution_path)}" target="_blank" rel="noopener" title="View saved solution">code</a>` : "";
      return `<tr><td class="muted" style="white-space:nowrap">${fmtDate(s.timestamp)}</td><td>${probLink(s)}${code}</td>
        <td><span class="pill" style="--c:${STATUS_COLOR[s.status] || "var(--muted)"}">${esc(s.status)}</span>${fail}</td>
        <td class="num muted">${s.total ? `${s.passed}/${s.total}` : ""}</td><td class="muted">${esc(s.lang)}</td>
        <td class="num muted">${esc(s.runtime || "")}</td><td>${cxCell(s.complexity, "time")}</td><td>${cxCell(s.complexity, "space")}</td><td>${logLink(s)}</td></tr>`;
    }).join("") || `<tr><td colspan="9" class="muted">No submissions in this range.</td></tr>`}</tbody></table></div></div>`;
}

// ---- render ---------------------------------------------------------------
function render() {
  const subs = filtered();
  const allInDiff = DATA.submissions.filter(s => !state.diff || s.difficulty === state.diff);
  const probs = byProblem(subs);
  const app = $("#app");
  if (!DATA.submissions.length) {
    app.innerHTML = `<div class="card empty"><h2>No submissions yet</h2>Submit something on LeetCode — the next sync (every ~15 min) will pick it up.</div>`;
    return;
  }
  app.innerHTML = kpis(subs, probs)
    + `<div class="grid two">${heatmap(allInDiff)}${mistakes(subs)}</div>`
    + `<div class="grid two">${weekly(subs)}${review(probs)}</div>`
    + `<div style="margin-bottom:16px">${topics(probs)}</div>`
    + log(subs);
  bindTips(app);
}

async function init() {
  bindSeg("#range", "days", "days"); bindSeg("#diff", "diff", "d"); restoreFilters();
  try {
    const r = await fetch("data/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch {
    DATA = { submissions: [] };
    $("#subtitle").textContent = "Waiting for the first sync.";
  }
  if (DATA.generated_at) {
    const ago = Math.round((Date.now() - new Date(DATA.generated_at)) / 60000);
    $("#subtitle").innerHTML = `<a href="https://leetcode.com/u/${esc(DATA.username)}/" target="_blank" rel="noopener">@${esc(DATA.username)}</a> · synced ${ago < 1 ? "just now" : ago < 120 ? ago + " min ago" : Math.round(ago / 60) + " h ago"}`;
  }
  if (DATA.repo) $("#sync-now").href = `https://github.com/${DATA.repo}/actions/workflows/sync.yml`; else $("#sync-now").remove();
  const b = [];
  if (DATA.auth === "expired") b.push("Your <b>LEETCODE_SESSION</b> secret has expired, so code, test-case details and complexity grading are paused. Paste a fresh cookie into the repo secrets.");
  if (DATA.auth === "public") b.push("Running on public profile data only (no code or failing test cases). Add <b>LEETCODE_SESSION</b> and <b>LEETCODE_CSRF</b> secrets to unlock it.");
  $("#banners").innerHTML = b.map(t => `<div class="banner">${t}</div>`).join("");
  render();
}
init();
</script>
</body>
</html>
